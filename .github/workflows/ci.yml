name: Source verification (offline)

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Lockfile integrity (no runtime dependencies)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deterministic SQLite + failure-path tests
        run: npm test
      - name: Pinned TypeScript compiler
        run: npm install --global --ignore-scripts --no-audit --no-fund typescript@5.8.3
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Confirm no deployment credential is used
        run: |
          test ! -f .env
          test ! -f worker/.dev.vars
          test ! -f android/google-services.json
