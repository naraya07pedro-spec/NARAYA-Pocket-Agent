name: Android GitHub preview build (no backend credentials)

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK Platform 37
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Unit tests and debug-signed pilot APK
        run: gradle --no-daemon --project-dir android :app:testDebugUnitTest :app:assembleDebug
      - name: Verify compiled APK signature, signer and package with Android SDK
        run: node scripts/android-owner-pilot.mjs --verify-apk
      - name: Verify cloud-sync security JVM tests actually executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path("android/app/build/test-results/testDebugUnitTest/TEST-dev.naraya.pocketagent.CloudSyncClientTest.xml")
          if not report.exists():
              raise SystemExit("CloudSyncClientTest XML missing; cannot claim tests passed")
          suite = ET.parse(report).getroot()
          metrics = {k: int(suite.attrib.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print("Cloud sync security tests:", metrics)
          if metrics["tests"] < 13 or any(metrics[x] for x in ("failures", "errors", "skipped")):
              raise SystemExit("Cloud sync security test count or result invalid")
          PY
      - name: Verify built APK permissions and absence of local secrets
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions android/app/build/outputs/apk/debug/app-debug.apk > /tmp/naraya-apk-permissions.txt
          grep -Fq 'android.permission.INTERNET' /tmp/naraya-apk-permissions.txt
          if grep -Eq 'android.permission.(READ_CONTACTS|READ_SMS|SEND_SMS|READ_CALL_LOG|RECORD_AUDIO|ACCESS_FINE_LOCATION|QUERY_ALL_PACKAGES)' /tmp/naraya-apk-permissions.txt; then
            echo 'ERROR: Unnecessary sensitive permission detected'
            exit 1
          fi
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          test ! -f android/google-services.json
          test ! -f android/app/google-services.json
          test ! -f android/local.properties
          test ! -f .env
      - uses: actions/upload-artifact@v4
        with:
          name: naraya-pocket-agent-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
